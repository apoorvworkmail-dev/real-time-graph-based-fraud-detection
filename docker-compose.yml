version: "3.9"

services:
  neo4j:
    image: neo4j:5.18.0
    container_name: fraud_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/fraud2024pass
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "fraud2024pass", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - fraud_net

  backend:
    build: ./backend
    container_name: fraud_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - fraud_net
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: fraud_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fraud_net

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  fraud_net:
    driver: bridge
